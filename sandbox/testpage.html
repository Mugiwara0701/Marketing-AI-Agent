<!doctype html>
<meta charset="utf-8">
<title>ready</title>
<style>
  body { margin: 0; font: 24px sans-serif; }
  #button { display: block; width: 100%; height: 300px; font-size: 48px; background: #cde; border: 0; }
  #box { display: block; width: 100%; height: 300px; font-size: 48px; box-sizing: border-box; }
  #spacer { height: 3000px; background: linear-gradient(#fff, #888); }
</style>
<!-- Big targets so the smoke test does not depend on the exact height of Chrome's toolbar. -->
<button id="button">CLICK ME</button>
<textarea id="box" placeholder="type here"></textarea>
<div id="spacer">scroll area</div>
<script>
  // The window title is how the harness observes the page without touching the DOM from outside.
  const state = {clicked: false, typed: "", scrolled: false};
  const show = () => {
    document.title = ["state", state.clicked ? "clicked" : "", state.scrolled ? "scrolled" : "",
                      state.typed ? "typed=" + state.typed : ""].filter(Boolean).join(" ");
  };
  document.getElementById("button").addEventListener("click", () => { state.clicked = true; show(); });
  document.getElementById("box").addEventListener("input", e => { state.typed = e.target.value; show(); });
  window.addEventListener("scroll", () => { state.scrolled = window.scrollY > 100; show(); });
</script>
