[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Shared library for the marketing-agent services: job contract, config, logging"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["agentkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
