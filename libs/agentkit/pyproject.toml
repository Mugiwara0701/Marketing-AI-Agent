[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Shared library for the marketing-agent services: job contract, config, logging"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn>=0.54.0",
  "pydantic>=2.13.5",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "asyncpg>=0.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]

[tool.setuptools.packages.find]
include = ["agentkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
