[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Shared library for the marketing-agent services: job contract, config, logging"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "pydantic>=2.14.1",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "asyncpg>=0.32.0",
  "google-api-python-client>=2.201.0",
  "google-auth>=2.62.0",
  "google-auth-httplib2>=0.4.4",
  "google-auth-oauthlib>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]

[tool.setuptools.packages.find]
include = ["agentkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
