# One combined PR per ecosystem per week (Dependabot cannot merge different ecosystems into a single PR).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directories:
      - /libs/agentkit
    schedule: {interval: weekly}
    groups:
      python-deps: {patterns: ["*"]}
