name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"   # weekly: new advisories can appear without any code change
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # scan history, not just the tip
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  dependencies:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install pip-audit
      - run: |
          pip-audit -r services/lead-service/requirements.txt
          pip-audit -r services/outreach-service/requirements.txt
          pip-audit -r services/content-service/requirements.txt
          pip-audit ./libs/agentkit
