# Slack approvals -> Supabase Edge Function -> repository_dispatch -> here.
# Edge Functions cannot reach the tailnet, so the follow-up job runs from a workflow.
name: dispatch
on:
  repository_dispatch:
    types: [run-job, lead-accepted, email-approved, reply-approved, post-approved]
jobs:
  lead-accepted:
    if: github.event.action == 'lead-accepted'
    uses: ./.github/workflows/_run-job.yml
    with: {service: lead, job: enrich_contacts, payload: "${{ toJSON(github.event.client_payload) }}"}
    secrets: inherit
  email-approved:
    if: github.event.action == 'email-approved'
    uses: ./.github/workflows/_run-job.yml
    with: {service: outreach, job: send, payload: "${{ toJSON(github.event.client_payload) }}"}
    secrets: inherit
  reply-approved:
    if: github.event.action == 'reply-approved'
    uses: ./.github/workflows/_run-job.yml
    with: {service: outreach, job: draft_replies, payload: "${{ toJSON(github.event.client_payload) }}"}
    secrets: inherit
  post-approved:
    if: github.event.action == 'post-approved'
    uses: ./.github/workflows/_run-job.yml
    with: {service: content, job: publish, payload: "${{ toJSON(github.event.client_payload) }}"}
    secrets: inherit
  run-job:
    if: github.event.action == 'run-job'
    uses: ./.github/workflows/_run-job.yml
    with:
      service: ${{ github.event.client_payload.service }}
      job: ${{ github.event.client_payload.job }}
    secrets: inherit
