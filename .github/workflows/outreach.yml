name: outreach
on:
  schedule:
    - cron: "43 3 * * 1-5"    # draft         09:13 IST weekdays
    - cron: "43 5 * * 1-5"    # send          11:13 IST weekdays
    - cron: "13 */2 * * 1-5"  # poll_replies  every 2h weekdays
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [draft, send, poll_replies, draft_replies]
        required: true
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULES_ENABLED == 'true'
    uses: ./.github/workflows/_run-job.yml
    with:
      service: outreach
      job: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.job ||
        github.event.schedule == '43 3 * * 1-5' && 'draft' ||
        github.event.schedule == '43 5 * * 1-5' && 'send' || 'poll_replies' }}
    secrets: inherit
