# Calls the pipeline control API (api/, on Render's free plan) every 5 minutes so it never sleeps: a sleeping
# service makes the dashboard's first request wait 30-60 s or time out. /health needs no token.
# Scheduled runs only happen on the default branch, can start a few minutes late, and GitHub pauses them after
# 60 days without commits (re-enable in the Actions tab). Set the repo variable PIPELINE_API_URL to override.
name: keep-api-awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        env:
          API_URL: ${{ vars.PIPELINE_API_URL || 'https://marketing-agent-pipeline-api.onrender.com' }}
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 "$API_URL/health"
