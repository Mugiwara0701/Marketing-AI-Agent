# Times are IST in scheduler/jobs.yaml; cron below is UTC (IST - 5:30). Keep both in sync.
name: lead
on:
  schedule:
    - cron: "37 20 * * *"   # collect_sources  02:07 IST
    - cron: "7 21 * * *"    # ingest_alerts    02:37 IST
    - cron: "37 21 * * *"   # qualify          03:07 IST
    - cron: "7 22 * * *"    # enrich_contacts  03:37 IST
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [collect_sources, ingest_alerts, qualify, enrich_contacts]
        required: true
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULES_ENABLED == 'true'
    uses: ./.github/workflows/_run-job.yml
    with:
      service: lead
      job: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.job ||
        github.event.schedule == '37 20 * * *' && 'collect_sources' ||
        github.event.schedule == '7 21 * * *' && 'ingest_alerts' ||
        github.event.schedule == '37 21 * * *' && 'qualify' || 'enrich_contacts' }}
    secrets: inherit
