# Static checks on every pull request and push to main. Rules live in the config files at the repo root
# (ruff.toml, mypy.ini, .sqlfluff, .yamllint.yaml, .hadolint.yaml, deno.json, .markdownlint.yaml).
# The same checks run locally through .pre-commit-config.yaml and `make lint`.
name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  typecheck:
    name: python (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e "libs/agentkit[dev]" mypy types-PyYAML
      - run: mypy libs/agentkit/agentkit eval/runner
      # each service has its own top-level `app` package, so they are checked one by one
      - run: |
          for s in lead outreach content; do
            (cd "services/$s-service" && mypy --config-file ../../mypy.ini app)
          done

  sql:
    name: sql (sqlfluff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install sqlfluff
      - run: sqlfluff lint supabase/migrations

  yaml:
    name: yaml (yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install yamllint
      - run: yamllint --strict -c .yamllint.yaml .

  shell:
    name: shell (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scheduler/scripts/*.sh

  workflows:
    name: github workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install actionlint-py
      - run: actionlint

  dockerfiles:
    name: dockerfiles (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        service: [lead-service, outreach-service, content-service]
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile
          config: .hadolint.yaml

  typescript:
    name: edge functions (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno fmt --check
      - run: deno lint
      - run: deno check supabase/functions/*/index.ts

  markdown:
    name: markdown (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v19
