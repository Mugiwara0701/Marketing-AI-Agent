# Static checks on every pull request and push to main. Rules live in the config files at the repo root
# (ruff.toml, mypy.ini, .sqlfluff, .yamllint.yaml, deno.json, .markdownlint.yaml).
# The same checks run locally through .pre-commit-config.yaml and `make lint`.
name: lint
on:
  pull_request:
  push:
    branches: [main, "fix/**", "feature/**"]
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff
      - run: ruff check . --output-format=github
      # On a failure, each file the formatter would change is reported as an annotation with its diff.
      - run: ruff format --check .
      - name: Report formatting differences
        if: failure()
        run: |
          ruff format --diff . > format.diff 2>&1 || true
          python - <<'PY'
          import re
          text = open("format.diff").read()
          for part in re.split(r"(?m)^(?=--- )", text):
              m = re.match(r"--- (\S+)", part)
              if m:
                  line = re.search(r"(?m)^@@ -(\d+)", part)
                  body = part[-3000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error file={m.group(1)},line={line.group(1) if line else 1},title=ruff format::{body}")
          PY

  typecheck:
    name: python (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e "libs/agentkit[dev]" mypy types-PyYAML
      # mypy's findings are also reported as annotations, so a failure can be read without the log.
      - run: set -o pipefail; mypy libs/agentkit/agentkit eval/runner agent api --show-column-numbers --no-error-summary | tee mypy.txt
      - name: Report mypy errors
        if: failure()
        run: >-
          sed -nE 's/^([^:]+):([0-9]+):([0-9]+): error: (.*)$/::error file=\1,line=\2,col=\3::\4/p' mypy.txt

  sql:
    name: sql (sqlfluff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install "sqlfluff==4.4.0"   # same as .pre-commit-config.yaml: versions disagree on layout rules
      - run: sqlfluff lint supabase/migrations

  yaml:
    name: yaml (yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install yamllint
      - run: yamllint --strict -c .yamllint.yaml .

  workflows:
    name: github workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install actionlint-py
      - run: actionlint

  typescript:
    name: edge functions (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno fmt --check
      - run: deno lint
      - run: deno check supabase/functions/*/index.ts

  markdown:
    name: markdown (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@v24
