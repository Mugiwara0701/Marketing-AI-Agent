# Static checks on every pull request and push to main. Rules live in the config files at the repo root
# (ruff.toml, mypy.ini, .sqlfluff, .yamllint.yaml, deno.json, .markdownlint.yaml).
# The same checks run locally through .pre-commit-config.yaml and `make lint`.
name: lint
on:
  pull_request:
  push:
    branches: [main, "fix/**", "feature/**"]
permissions:
  contents: read
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff
      - run: ruff check . --output-format=github
      # On a failure, each file the formatter would change is reported as an annotation with its diff.
      - run: ruff format --check .
      - name: Report formatting differences
        if: failure()
        run: |
          ruff format --diff . > format.diff 2>&1 || true
          python - <<'PY'
          import re
          # GitHub shows at most 10 error annotations per step: the whole diff goes into at most 10, split per file.
          parts = [p for p in re.split(r"(?m)^(?=--- )", open("format.diff").read()) if p.startswith("--- ")]
          groups = [parts[i::10] for i in range(min(10, len(parts)))]
          for group in groups:
              first = re.match(r"--- (\S+)", group[0]).group(1)
              body = "".join(group)[:60000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error file={first},line=1,title=ruff format ({len(group)} file(s))::{body}")
          PY

  typecheck:
    name: python (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e "libs/agentkit[dev]" mypy types-PyYAML
      # mypy's findings are also reported as annotations, so a failure can be read without the log.
      - run: set -o pipefail; mypy libs/agentkit/agentkit eval/runner agent api --show-column-numbers --no-error-summary 2>&1 | tee mypy.txt
      - name: Report mypy errors
        if: failure()
        run: >-
          sed -nE 's/^([^:]+):([0-9]+):([0-9]+): error: (.*)$/::error file=\1,line=\2,col=\3::\4/p' mypy.txt;
          grep -vE '^[^:]+:[0-9]+:[0-9]+: (error|note):' mypy.txt | head -n 20 | sed 's/^/::error title=mypy::/'

  sql:
    name: sql (sqlfluff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install "sqlfluff==4.4.0"   # same as .pre-commit-config.yaml: versions disagree on layout rules
      - run: sqlfluff lint supabase/migrations

  yaml:
    name: yaml (yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install yamllint
      - run: yamllint --strict -c .yamllint.yaml .

  workflows:
    name: github workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install actionlint-py
      - run: actionlint

  typescript:
    name: edge functions (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno fmt --check
      - run: deno lint
      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions

  markdown:
    name: markdown (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
