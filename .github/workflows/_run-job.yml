# Reusable: join the tailnet, then call one service job and wait for it to finish.
# TODO before production: pin third-party actions to commit SHAs and verify Tailscale action inputs.
name: run-job
on:
  workflow_call:
    inputs:
      service: {type: string, required: true}   # lead | outreach | content
      job: {type: string, required: true}
      payload: {type: string, required: false, default: "{}"}
    secrets:
      TS_OAUTH_CLIENT_ID: {required: true}
      TS_OAUTH_SECRET: {required: true}
      JOB_TOKEN: {required: true}
      LEAD_URL: {required: false}
      OUTREACH_URL: {required: false}
      CONTENT_URL: {required: false}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: ${{ inputs.service }}-${{ inputs.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Call job
        env:
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
          LEAD_URL: ${{ secrets.LEAD_URL }}
          OUTREACH_URL: ${{ secrets.OUTREACH_URL }}
          CONTENT_URL: ${{ secrets.CONTENT_URL }}
          SVC: ${{ inputs.service }}
          JOB: ${{ inputs.job }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          case "$SVC" in
            lead) export SERVICE_URL="$LEAD_URL" ;;
            outreach) export SERVICE_URL="$OUTREACH_URL" ;;
            content) export SERVICE_URL="$CONTENT_URL" ;;
            *) echo "::error::unknown service $SVC"; exit 1 ;;
          esac
          bash scheduler/scripts/call_service.sh "$SVC" "$JOB" "$PAYLOAD"
