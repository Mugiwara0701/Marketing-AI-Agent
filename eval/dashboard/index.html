<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <nav class="tabs" aria-label="Main">
        <a class="tab" href="#/dashboard" data-tab="dashboard">Dashboard</a>
        <a class="tab" href="#/history" data-tab="history">History</a>
        <a class="tab" href="#/blogs" data-tab="blogs">Blogs</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    </div>
  </header>
  <div id="page-host"></div>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details" aria-hidden="true" tabindex="-1" inert></aside>
  <script type="module" src="js/app.js"></script>
</body>
</html>
