# Desktop lead search (LEADS_MODE=desktop / `python -m agent run --desktop`): a visible Chrome window on the Xubuntu
# desktop, driven with the mouse and keyboard. Queries are typed into the address bar; results are read from the screen.
desktop:
  # Search engines, tried in turn (one search each, round-robin). "default" types the query into Chrome's own
  # search bar; the others open the engine with the query. A blocked engine rests for engine_rest_minutes.
  engines:
    - default
    - https://duckduckgo.com/?q={q}
    - https://www.bing.com/search?q={q}
  engine_rest_minutes: 30
  # Where to look. {q} is the query. "web" is the open web; the others restrict the search to one platform.
  platforms:
    - {name: web, template: "{q}"}
    - {name: reddit, template: "site:reddit.com {q}"}
    - {name: hackernews, template: "site:news.ycombinator.com {q}"}
    - {name: github, template: "site:github.com {q} looking for vendor OR partner OR contractor"}
  # Opening queries. The agent adds its own from what it sees on the results pages.
  queries:
    - AOSP development project outsourcing
    - Android platform development project vendor
    - Android BSP development outsourcing
    - Android device bring-up project
    - Android framework customization partner
    - Android HAL development project
    - Android Automotive AAOS development partner
    - embedded Linux development outsourcing
    - embedded systems development project partner
    - Linux BSP project vendor
    - device driver development outsourcing
    - firmware development outsourced project
    - embedded software outsourcing company needed
    - IoT embedded development project RFP
    - custom Android OS development for our device
    - Android embedded software vendor request for proposal
    - looking for agency to build Android based hardware product
    - need external team Yocto embedded Linux board bring-up
  # Follow-up queries the model invents from the results must contain one SERVICE word and one PROJECT word,
  # so the search cannot drift to "more companies like the last one" (e.g. robotaxi makers).
  query_service_terms: [aosp, android, bsp, embedded, yocto, buildroot, firmware, kernel, driver, drivers, aaos, hal, linux, bring-up, iot]
  query_project_terms: [outsourcing, outsourced, vendor, partner, agency, rfp, contract, contractor, external, proposal, project, needed, "looking for", services, company]
  # Never a lead. Autonomous-driving firms and big car makers / brands build their platform software in-house.
  # exclude_terms are matched as whole words in the result and the first part of the page; exclude_companies
  # against the site name (nuro.ai -> nuro) and the company name.
  exclude_terms: [robotaxi, "autonomous vehicle", "autonomous vehicles", "autonomous driving", self-driving, "self driving", driverless, lidar]
  exclude_companies: [nuro, zoox, waymo, cruise, aurora, mobileye, motional, tusimple, argo, tesla, rivian, lucid, uber, lyft, apple, google, amazon, microsoft, samsung, xiaomi, huawei, oppo, vivo, fairphone]
