# Desktop lead search (LEADS_MODE=desktop / `python -m agent run --desktop`): a visible Chrome window on the Xubuntu
# desktop, driven with the mouse and keyboard. Queries are typed into the address bar; results are read from the screen.
desktop:
  # Search engines, tried in turn (one search each, round-robin). "default" types the query into Chrome's own
  # search bar; the others open the engine with the query. A blocked engine rests for engine_rest_minutes.
  engines:
    - default
    - https://duckduckgo.com/?q={q}
    - https://www.bing.com/search?q={q}
  engine_rest_minutes: 30
  # Where to look. {q} is the query. Device makers are found on the open web; the platform sites (reddit, hacker news,
  # github) are about projects and people, not companies that build devices.
  platforms:
    - {name: web, template: "{q}"}
  # Added to every search so job ads stay out of the results (minus operators work in Google, Bing and DuckDuckGo).
  query_suffix: -jobs -careers -hiring -vacancy -vacancies -salary -internship
  # Opening queries: device makers worldwide (never Canada, the United Kingdom or Germany). The agent adds follow-ups
  # from what it sees, but only ones that pass query_topic_terms / query_actor_terms below.
  queries:
    - RFID reader manufacturer
    - RFID reader manufacturer India
    - UHF RFID handheld reader manufacturer
    - UHF RFID handheld reader manufacturer USA
    - smart card reader manufacturer
    - smart card reader manufacturer China
    - NFC reader manufacturer
    - NFC reader manufacturer Taiwan
    - biometric fingerprint device manufacturer
    - biometric fingerprint device manufacturer Singapore
    - face recognition terminal manufacturer
    - face recognition terminal manufacturer UAE
    - access control terminal manufacturer
    - access control terminal manufacturer Brazil
    - time attendance device manufacturer
    - time attendance device manufacturer Australia
    - rugged handheld terminal manufacturer
    - rugged handheld terminal manufacturer Netherlands
    - Android POS terminal manufacturer
    - Android POS terminal manufacturer France
    - payment terminal manufacturer
    - payment terminal manufacturer Italy
    - barcode scanner manufacturer
    - barcode scanner manufacturer Spain
    - mobile computer PDA manufacturer
    - mobile computer PDA manufacturer Poland
    - digital signage player manufacturer
    - digital signage player manufacturer Turkey
    - self-service kiosk manufacturer
    - self-service kiosk manufacturer South Korea
    - set-top box manufacturer
    - set-top box manufacturer Japan
    - IoT gateway manufacturer
    - IoT gateway manufacturer Vietnam
    - GPS tracker telematics device manufacturer
    - GPS tracker telematics device manufacturer Israel
    - smart meter manufacturer
    - smart meter manufacturer Mexico
    - thermal receipt printer manufacturer
    - thermal receipt printer manufacturer South Africa
    - industrial Android tablet manufacturer
    - industrial Android tablet manufacturer Malaysia
    - electronic shelf label manufacturer
    - electronic shelf label manufacturer Sweden
    - vehicle telematics unit manufacturer
    - vehicle telematics unit manufacturer Switzerland
    - RFID and identity solutions provider
    - RFID and identity solutions provider Finland
    - smart card and ID card printer manufacturer
    - smart card and ID card printer manufacturer India
    - queue management kiosk manufacturer
    - queue management kiosk manufacturer USA
    - handheld data terminal supplier
    - handheld data terminal supplier China
    - need Android BSP porting for our custom board
    - looking for partner to develop Android firmware for our RFID reader
    - RFID reader Android app development partner
    - RFQ Android handheld firmware development
    - tender embedded Linux board bring-up project
    - hardware startup needs embedded Android firmware partner
    - outsource Android firmware development hardware company
    - custom board AOSP bring-up UART bootloader project
    - need Linux BSP and RFID reader integration for our device
    - looking for vendor to customize Android OS for rugged handheld
    - IoT device company needs firmware and app development team
    - contract project Android board bring-up peripheral integration
  # Follow-up queries invented by the model must name a kind of device (topic) AND a who (actor), and nothing excluded.
  query_topic_terms: [rfid, nfc, smart card, biometric, fingerprint, face, access control, attendance, handheld, rugged, pos, payment, terminal, barcode, scanner, mobile computer, tablet, signage, kiosk, set-top, iot, gateway, gps, tracker, telematics, meter, printer, shelf label, reader, identity, device, devices]
  query_actor_terms: [need, needed, looking for, rfq, rfp, tender, partner, outsource, outsourcing, vendor, project, contract, manufacturer, manufacturers, maker, makers, supplier, suppliers, provider, producer, company, companies, oem, odm, solutions]
  # A page is looked at only if it shows at least DESKTOP_MIN_KEYWORDS (default 2) different words from keywords (top of
  # this file: AOSP, BSP, Yocto...) plus product_keywords: what a company that builds devices writes about itself.
  product_keywords: [uart, bootloader, board, bring-up, porting, sdk, android, linux, embedded, firmware, rfid, nfc, reader, readers, smart card, biometric, fingerprint, access control, attendance, handheld, terminal, pos, kiosk, tablet, barcode, scanner, signage, set-top, iot, gateway, telematics, tracker, meter, printer, manufacturer, oem, odm, hardware]
  # Never a lead. Autonomous-driving firms and big brands build their platform software in-house; embedded-software
  # vendors (Canonical, Wind River...) sell software, not devices, and are mostly competitors.
  exclude_terms: [robotaxi, "autonomous vehicle", "autonomous vehicles", "autonomous driving", self-driving, "self driving", driverless, lidar]
  exclude_companies: [nuro, zoox, waymo, cruise, aurora, mobileye, motional, tusimple, argo, tesla, rivian, lucid, uber, lyft, apple, google, amazon, microsoft, samsung, xiaomi, huawei, oppo, vivo, fairphone, arrow, avnet, mouser, digikey, farnell, canonical, redhat, "red hat", suse, windriver, "wind river", timesys, montavista, linaro, mender, balena]
  # Not pitched: companies based in these countries. Checked on the site ending, on the location the model reads from
  # the page, and on follow-up queries.
  exclude_countries: [canada, "united kingdom", uk, "u.k.", "great britain", england, scotland, wales, "northern ireland", germany, deutschland]
  exclude_tlds: [".ca", ".uk", ".co.uk", ".de"]
