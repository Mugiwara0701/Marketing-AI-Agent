# Free, public sources only (no paid APIs). Edit freely; the agent reads this file on every run.

# A listing/page is only looked at by the LLM if it mentions at least one of these (case-insensitive).
keywords:
  - aosp
  - android platform
  - android automotive
  - aaos
  - android hal
  - hidl
  - bsp
  - board support package
  - bring-up
  - bringup
  - device bring up
  - embedded linux
  - yocto
  - buildroot
  - gki
  - linux kernel
  - device driver
  - custom rom

# Job boards / project portals with free public feeds or APIs.
job_apis:
  hn_hiring: true # Hacker News "Who is hiring" and "Seeking freelancer" threads (Algolia API)
  remoteok: true # https://remoteok.com/api
  remotive: true # https://remotive.com/api/remote-jobs
  weworkremotely: true # RSS
  arbeitnow: true # https://www.arbeitnow.com/api/job-board-api (Europe)
  jobicy: true # https://jobicy.com/api/v2/remote-jobs (polled at most hourly)
  himalayas: true # https://himalayas.app/jobs/api/search
  themuse: true # https://www.themuse.com/api/public/jobs (set THEMUSE_API_KEY for higher limits)
  adzuna: true # needs free keys ADZUNA_APP_ID / ADZUNA_APP_KEY in .env, else skipped
  jooble: true # needs a free key JOOBLE_API_KEY in .env, else skipped

# Extra RSS/Atom feeds of job or project listings (company career feeds, portals).
extra_lead_feeds: []

# Portals that forbid scraping are blocked in code (LinkedIn, Indeed, Naukri, Glassdoor, Monster, Foundit).

# Posts older than this many days are dropped (by the source's date, or the newest date written in the text).
max_age_days: 45

# We sell project delivery, not recruiting: keep contract / freelance / outsourced project work and drop permanent jobs.
# work_type: projects (default) or all. Product-company pages and the HN freelancer thread always pass.
work_type: projects
project_keywords:
  - contract
  - contractor
  - freelance
  - freelancer
  - consultant
  - consulting
  - project-based
  - project based
  - outsource
  - outsourced
  - outsourcing
  - rfp
  - request for proposal
  - statement of work
  - fixed price
  - fixed-price
  - short-term
  - short term
  - agency
  - turnkey

# Free web search for pages not on the boards above. Set SEARXNG_URL (self-hosted SearXNG) for reliable results;
# without it the agent tries DuckDuckGo's HTML page, which usually blocks bots.
search_queries:
  - '"AOSP" contract developer needed project'
  - '"Android Automotive" freelance OR contract engineer project'
  - 'need "Android BSP" developer freelance project'
  - '"board bring-up" embedded linux contractor needed'
  - 'outsource Android device firmware development project'
  - 'AOSP customization project "request for proposal"'
  - 'embedded Linux Yocto BSP "statement of work" OR "RFP"'
  - 'looking for agency Android custom ROM OEM firmware development'
  - '"Android HAL" OR "vehicle HAL" contract engineer short-term'

# Companies that BUILD products on Android / embedded Linux (not hiring pages), e.g. RFID, NFC and payment device makers.
