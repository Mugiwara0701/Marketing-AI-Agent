# Routes every task to the single "dev" model. Use while only agent-dev is served (first tests on a new machine):
#   ROUTING_CONFIG=config/routing.dev-only.yaml
default: dev
tasks:
  lead.assess: dev
  lead.extract_contact: dev
  lead.search: dev
  outreach.draft: dev
  outreach.pitch: dev
  # The GUI agent needs a vision model even when everything else uses the one dev model.
  gui.step: vlm
