# Research list of embedded engineering companies: `python -m agent embedded-list`
# (docs/embedded-companies-research.md). Kept apart from the lead search: nothing here is pitched or stored in the
# database, and config/sources.yaml `exclude_*` lists do not apply.
#
# seeds: starting points only. Every one is opened and checked; a site that cannot be reached is reported as
# "Could not access – check manually". website may be left empty: it is then found by a web search for the name.
# aliases: other domains of the same company (acquired brands, product sites), so they are not listed twice and
# their published addresses count as the company's own.

