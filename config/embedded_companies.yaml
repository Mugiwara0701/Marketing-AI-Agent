# Searches that find more candidates (SearXNG if SEARXNG_URL is set, else DuckDuckGo). A found site joins the list
# only if its own pages use target-domain wording (Yocto, BSP, AOSP, OTA...).
discovery_queries:
  - AOSP BSP services company
  - Yocto consulting company
  - embedded Linux consultancy
  - board bring-up BSP development services
  - Android Automotive AAOS engineering services
  - OTA software update platform embedded devices
  - embedded device security secure boot consulting
  - Linux kernel device driver development company
  - firmware development services company
  - system on module BSP Yocto vendor
  - Android HAL development services
  - OTA update solutions embedded

# Pages that list companies with links to their websites. Each link to another site is a candidate. A page
# that cannot be read (refuses automated visitors, or builds its list with JavaScript) is reported as
# "check manually" and not worked around.
directory_pages:
  - https://www.yoctoproject.org/ecosystem/participants/
  - https://www.yoctoproject.org/community/members/
  - https://www.automotivelinux.org/about/members/
  - https://www.linuxfoundation.org/about/members
  - https://www.toradex.com/partner-network
  - https://www.nxp.com/design/design-center/partner-marketplace:PARTNER-MARKETPLACE
  - https://www.renesas.com/en/partners
  - https://www.st.com/content/st_com/en/partner/partner-program.html

# Partner directories without a public page an automated visitor can read: listed in the report to check by hand.
directories_manual:
  - TI Design Network (ti.com) - check manually
  - Qualcomm partner directory (qualcomm.com) - check manually
  - MediaTek partner list (mediatek.com) - check manually
  - Android / AOSP partner lists (android.com) - check manually

# Never a source and never a target: marketplaces, e-commerce and B2B listing sites. Matched on any part of the
# host name ("amazon" covers amazon.in and aws.amazon.com). A search result from one of them is ignored.
