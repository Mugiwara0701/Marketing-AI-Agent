<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
</head>
<!--
  Outreach email template: a plain business letter (no banner, no card, no colours), so it reads as one person writing
  to another. Placeholders (all filled in by agent/mailer.py, HTML-escaped):
    {{subject}} {{preheader}} {{body}} {{signature}} {{sender_name}} {{sender_title}} {{company_name}}
    {{company_address}} {{company_website}} {{company_website_url}} {{unsubscribe_url}}
  {{body}} is the approved draft as <p> paragraphs. {{signature}} is the sender block with only the settings that are
  filled in (SENDER_NAME, SENDER_TITLE, COMPANY_NAME, COMPANY_WEBSITE, COMPANY_PHONE).
  Keep styles inline: most mail apps drop <style> blocks. Point EMAIL_TEMPLATE at another file to change the design.
-->
<body style="margin:0;padding:0;">
<span style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}</span>
<div style="max-width:620px;padding:16px 8px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;">
  {{body}}
  <p style="margin:18px 0 4px 0;">Best regards,</p>
  <p style="margin:0 0 24px 0;line-height:1.5;">{{signature}}</p>
  <p style="margin:0;padding-top:12px;border-top:1px solid #d0d4d9;font-size:12px;line-height:1.5;color:#6a737d;">
    {{company_name}} &middot; {{company_address}}<br>
    You received this because your company's public contact details list this address.
    <a href="{{unsubscribe_url}}" style="color:#6a737d;">Unsubscribe</a>
  </p>
</div>
</body>
</html>
