# Services only. The LLM (vLLM + embeddings) runs on the GPU host: see services/llm-service/README.md.
x-service: &svc
  env_file: .env
  restart: unless-stopped

services:
  lead-service:
    <<: *svc
    build: {context: ., dockerfile: services/lead-service/Dockerfile}
    ports: ["127.0.0.1:8101:8000"]
  outreach-service:
    <<: *svc
    build: {context: ., dockerfile: services/outreach-service/Dockerfile}
    ports: ["127.0.0.1:8102:8000"]
  content-service:
    <<: *svc
    build: {context: ., dockerfile: services/content-service/Dockerfile}
    ports: ["127.0.0.1:8103:8000"]
